services:
  app:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DB_PATH: /data/db/app.sqlite
      STORAGE_DIR: /data/files
    volumes:
      # Two independent mounts: point each at whichever host disk suits it.
      - ${DB_DIR:-./data/db}:/data/db # SQLite database: small, wants a reliable disk
      - ${FILES_DIR:-./data/files}:/data/files # uploaded blobs: large
